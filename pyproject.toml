[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gr"
version = "0.2.0"
description = "AI-GR — The Agentic Governance Ribbon. Reference implementation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Anil Singh" },
]
keywords = [
    "ai-governance",
    "agentic-ai",
    "ai-gr",
    "provenance",
    "eu-ai-act",
    "gdpr",
    "deployer-obligations",
    "nist-ai-rmf",
    "iso-42001",
    "hipaa",
    "mdr",
    "nis2",
    "dora",
    "compliance",
    "reference-architecture",
    "vendor-neutral",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.6",
    "cryptography>=42.0",
    "click>=8.1",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
export = [
    "jinja2>=3.1",
    "reportlab>=4.0",
]
adapters = [
    "requests>=2.31",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.scripts]
ai-gr = "ai_gr.cli:cli"
ai-gr-verify = "ai_gr.verify_cli:cli"

[project.urls]
Homepage = "https://ai-gr.dev"
Repository = "https://github.com/anilscorpio82/ai-gr"
Documentation = "https://ai-gr.dev/docs"
Issues = "https://github.com/anilscorpio82/ai-gr/issues"
Paper = "https://doi.org/10.5281/zenodo.XXXXXXX"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
